databases:
  # PostgreSQL Database
  - name: ghost-postgres
    databaseName: ghost
    plan: basic-1gb

services:
  # Start Our Main API Endpoint
  - type: web
    name: ghost-api
    runtime: node
    branch: ghost
    buildCommand: npm install
    preDeployCommand: npx knex migrate:latest
    startCommand: npm start
    numInstances: 1
    plan: standard
    domains:
      - 'data.appjelly.io'

  # Our Ghost Worker Class - Main AI & Content Generation Worker
  # Throng handles multiple workers internally via GHOST_WORKERS env var (default: 2)
  - type: worker
    name: ghost-worker
    runtime: node
    branch: ghost
    buildCommand: npm install
    startCommand: node src/background/managers/ghost.js
    numInstances: 1
    plan: standard

  # Our Twitter Worker Class - Handles Twitter API calls (sync-network, curated topics)
  # Throng handles multiple workers internally via TWITTER_WORKERS env var (default: 1)
  - type: worker
    name: ghost-twitter-worker
    runtime: node
    branch: ghost
    buildCommand: npm install
    startCommand: node src/background/managers/twitter.js
    numInstances: 1
    plan: starter

  # Our Cleanup Worker Class - Handles expired media and cleanup tasks
  # Throng handles multiple workers internally via CLEANUP_WORKERS env var (default: 1)
  - type: worker
    name: ghost-cleanup-worker
    runtime: node
    branch: ghost
    buildCommand: npm install
    startCommand: node src/background/managers/cleanup.js
    numInstances: 1
    plan: starter

  # Redis Cache
  - type: redis
    name: ghost-redis
    plan: standard
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
